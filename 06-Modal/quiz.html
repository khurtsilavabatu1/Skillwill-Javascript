<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>მოდალური ფანჯარა - ქვიზი</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .quiz-container {
      max-width: 750px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #e94560;
      margin-bottom: 0.4rem;
      font-size: 1.6rem;
      line-height: 1.35;
    }

    .subtitle {
      text-align: center;
      color: #7f8fa6;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .progress-bar-track {
      background: #16213e;
      border-radius: 8px;
      height: 10px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #e94560, #0f3460);
      height: 100%;
      border-radius: 8px;
      transition: width 0.4s ease;
    }

    .question-counter {
      text-align: center;
      margin-bottom: 1rem;
      color: #7f8fa6;
      font-size: 0.95rem;
    }

    .section-label {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-label.main {
      background: #0f3460;
      color: #63b3ed;
    }

    .question-card {
      background: #16213e;
      border-radius: 12px;
      padding: 2rem;
      border: 2px solid #0f3460;
      transition: border-color 0.3s ease;
    }

    .question-card.correct {
      border-color: #38a169;
    }

    .question-card.incorrect {
      border-color: #e53e3e;
    }

    .question-text {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      line-height: 1.55;
    }

    pre.code-block {
      background: #0d1b2a;
      border: 1px solid #1b3a5c;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      overflow-x: auto;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #a8d8a8;
      white-space: pre;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: #1a1a2e;
      border: 2px solid #2c3e6b;
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      color: #e0e0e0;
      font-size: 0.97rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      line-height: 1.45;
    }

    .option-btn:hover:not(.disabled) {
      background: #0f3460;
      border-color: #4a6fa5;
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: #63b3ed;
      background: #1a365d;
    }

    .option-btn.correct-answer {
      border-color: #38a169;
      background: #1c3a2a;
      color: #9ae6b4;
    }

    .option-btn.wrong-answer {
      border-color: #e53e3e;
      background: #3a1c1c;
      color: #feb2b2;
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.75;
    }

    .option-btn.disabled.correct-answer {
      opacity: 1;
    }

    .feedback {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: #1c3a2a;
      color: #68d391;
      border: 1px solid #38a169;
    }

    .feedback.incorrect {
      background: #3a1c1c;
      color: #fc8181;
      border: 1px solid #e53e3e;
    }

    .explanation-box {
      background: #0d1b2a;
      border-left: 4px solid #e94560;
      padding: 1rem 1.2rem;
      margin-top: 0.8rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.92rem;
      color: #b0bec5;
      line-height: 1.6;
      display: none;
    }

    .explanation-box.visible {
      display: block;
    }

    .explanation-box .explanation-title {
      font-weight: 700;
      color: #e94560;
      margin-bottom: 0.3rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      gap: 1rem;
    }

    .nav-btn {
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn.prev {
      background: #2c3e6b;
      color: #e0e0e0;
    }

    .nav-btn.prev:hover {
      background: #3a5298;
    }

    .nav-btn.next {
      background: #e94560;
      color: #fff;
    }

    .nav-btn.next:hover {
      background: #c73652;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Results screen */
    .results-screen {
      background: #16213e;
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      border: 2px solid #0f3460;
    }

    .results-screen h2 {
      color: #e94560;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      border: 6px solid;
    }

    .score-circle.excellent {
      border-color: #38a169;
      color: #68d391;
      background: #1c3a2a;
    }

    .score-circle.good {
      border-color: #d69e2e;
      color: #f6e05e;
      background: #3a351c;
    }

    .score-circle.needs-work {
      border-color: #e53e3e;
      color: #fc8181;
      background: #3a1c1c;
    }

    .score-circle .score-label {
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    .score-breakdown {
      margin: 1.5rem 0;
      font-size: 1rem;
      color: #a0aec0;
      line-height: 2;
    }

    .score-breakdown strong {
      color: #e0e0e0;
    }

    .restart-btn {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .restart-btn:hover {
      background: #c73652;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      .question-card {
        padding: 1.3rem;
      }
      pre.code-block {
        font-size: 0.8rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>მოდალური ფანჯარა - ქვიზი</h1>
    <p class="subtitle">12 კითხვა - Modal Window Quiz</p>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
    </div>

    <!-- Question area -->
    <div id="questionArea">
      <p class="question-counter" id="questionCounter"></p>

      <div class="question-card" id="questionCard">
        <span class="section-label main" id="sectionLabel"></span>
        <div class="question-text" id="questionText"></div>
        <pre class="code-block hidden" id="codeBlock"></pre>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-title">ახსნა</div>
          <div id="explanationText"></div>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)">&#8592; წინა</button>
        <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">შემდეგი &#8594;</button>
      </div>
    </div>

    <!-- Results screen -->
    <div class="results-screen hidden" id="resultsScreen">
      <h2>ქვიზი დასრულებულია!</h2>
      <div class="score-circle" id="scoreCircle">
        <span id="scorePercent"></span>
        <span class="score-label" id="scoreLabel"></span>
      </div>
      <div class="score-breakdown" id="scoreBreakdown"></div>
      <button class="restart-btn" onclick="restartQuiz()">&#x1F504; თავიდან დაწყება</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        section: 'main',
        topic: 'querySelectorAll',
        question: "რა განსხვავებაა querySelector-სა და querySelectorAll-ს შორის?",
        code: null,
        options: [
          "არანაირი განსხვავება",
          "querySelector აბრუნებს პირველ ელემენტს, querySelectorAll — ყველას (NodeList)",
          "querySelectorAll უფრო სწრაფია",
          "querySelector მხოლოდ id-ით მუშაობს"
        ],
        correct: 1,
        explanation: "querySelector აბრუნებს პირველ შესაბამის ელემენტს ან null-ს. querySelectorAll აბრუნებს NodeList-ს — ყველა შესაბამისი ელემენტის კოლექციას, მაშინაც კი თუ ერთი ან ნული ელემენტია."
      },
      {
        section: 'main',
        topic: 'classList',
        question: "რას აკეთებს element.classList.remove('hidden')?",
        code: null,
        options: [
          "შლის ელემენტს DOM-იდან",
          "შლის 'hidden' CSS კლასს ელემენტიდან",
          "მალავს ელემენტს",
          "შლის ყველა CSS კლასს"
        ],
        correct: 1,
        explanation: "classList.remove() მხოლოდ მითითებულ CSS კლასს შლის ელემენტიდან. თუ 'hidden' კლასს აქვს display: none წესი CSS-ში, კლასის წაშლით ელემენტი გამოჩნდება."
      },
      {
        section: 'main',
        topic: 'classList',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const el = document.querySelector('.box');
el.classList.add('active');
el.classList.add('visible');
console.log(el.classList.contains('active'));`,
        options: [
          "false",
          "true",
          "undefined",
          "'active'"
        ],
        correct: 1,
        explanation: "classList.contains() ამოწმებს, აქვს თუ არა ელემენტს მითითებული კლასი და boolean-ს აბრუნებს. 'active' დაემატა classList.add()-ით, ამიტომ contains('active') არის true."
      },
      {
        section: 'main',
        topic: 'NodeList',
        question: "როგორ ვამატებთ ივენთ ლისენერს querySelectorAll-ის ყველა ელემენტზე?",
        code: `const btns = document.querySelectorAll('.show-modal');`,
        options: [
          "btns.addEventListener('click', fn)",
          "for ციკლით თითოეულ ელემენტზე ცალ-ცალკე",
          "btns.click(fn)",
          "btns.forEach.addEventListener('click', fn)"
        ],
        correct: 1,
        explanation: "querySelectorAll NodeList-ს აბრუნებს, არა ერთ ელემენტს. NodeList-ზე პირდაპირ addEventListener ვერ გამოიძახებ. ციკლით (for ან forEach) უნდა გაიაროთ და თითოეულ ელემენტზე ცალ-ცალკე დაამატოთ."
      },
      {
        section: 'main',
        topic: 'Keyboard Events',
        question: "რას გამოიტანს ეს კოდი Escape ღილაკის დაჭერისას?",
        code: `document.addEventListener('keydown', function(e) {
  console.log(e.key);
});`,
        options: [
          "'keydown'",
          "'Escape'",
          "'27'",
          "undefined"
        ],
        correct: 1,
        explanation: "keydown ივენთის ობიექტის .key თვისება აბრუნებს დაჭერილი ღილაკის სახელს სტრინგის სახით. Escape ღილაკისთვის ეს არის 'Escape'. (ძველ ბრაუზერებში e.keyCode=27 გამოიყენებოდა)."
      },
      {
        section: 'main',
        topic: 'Hidden Pattern',
        question: "რა არის 'hidden' კლასის პატერნი?",
        code: null,
        options: [
          "JavaScript-ში ელემენტის წაშლა",
          "CSS კლასი display: none-ით, რომელსაც classList-ით ვმართავთ ელემენტის ჩვენება/დამალვისთვის",
          "HTML hidden ატრიბუტი",
          "ბრაუზერის ჩაშენებული ფუნქცია"
        ],
        correct: 1,
        explanation: "ეს პატერნი ნიშნავს CSS-ში .hidden { display: none } კლასის შექმნას და JS-ით classList.add('hidden') / classList.remove('hidden') გამოყენებას ელემენტის დამალვა/ჩვენებისთვის. ეს უფრო სუფთაა ვიდრე ინლაინ style.display-ის ცვლა."
      },
      {
        section: 'main',
        topic: 'Overlay',
        question: "რატომ ვიყენებთ overlay-ს მოდალთან ერთად?",
        code: null,
        options: [
          "რომ გვერდი უფრო სწრაფად ჩაიტვირთოს",
          "რომ ფონი დაბნელდეს და მომხმარებლის ყურადღება მოდალზე გამახვილდეს",
          "რომ მოდალის CSS მუშაობდეს",
          "overlay სავალდებულოა HTML სტანდარტით"
        ],
        correct: 1,
        explanation: "overlay (ნახევრად გამჭვირვალე ბნელი ფონი) ვიზუალურად გამოყოფს მოდალს დანარჩენი კონტენტისგან. ასევე overlay-ზე კლიკით შეგვიძლია მოდალის დახურვა — ეს სტანდარტული UX პატერნია."
      },
      {
        section: 'main',
        topic: 'Reusable Functions',
        question: "რატომ ვქმნით openModal და closeModal ფუნქციებს?",
        code: `const openModal = function() {
  modal.classList.remove('hidden');
  overlay.classList.remove('hidden');
};
const closeModal = function() {
  modal.classList.add('hidden');
  overlay.classList.add('hidden');
};`,
        options: [
          "სავალდებულოა addEventListener-ისთვის",
          "DRY პრინციპი — ერთ ფუნქციას რამდენიმე ადგილიდან ვიძახებთ (ღილაკზე, overlay-ზე, Escape-ზე)",
          "ფუნქციის გარეშე classList არ მუშაობს",
          "მხოლოდ კოდის ლამაზად ჩაწერისთვის"
        ],
        correct: 1,
        explanation: "closeModal 3 ადგილიდან იძახება: X ღილაკზე, overlay-ზე და Escape-ზე. ფუნქციის გარეშე ერთი და იგივე კოდი 3-ჯერ გამეორდებოდა. openModal-საც რამდენიმე ღილაკი იძახებს."
      },
      {
        section: 'main',
        topic: 'Event Types',
        question: "რა განსხვავებაა 'click' და 'keydown' ივენთებს შორის?",
        code: null,
        options: [
          "არანაირი, ორივე ერთნაირად მუშაობს",
          "'click' მაუსის მოქმედებაა, 'keydown' — კლავიატურის ღილაკის დაჭერა",
          "'click' უფრო სწრაფია",
          "'keydown' მხოლოდ input ელემენტებზე მუშაობს"
        ],
        correct: 1,
        explanation: "'click' ფაიერდება მაუსის დაწკაპუნებისას ელემენტზე. 'keydown' ფაიერდება ნებისმიერი კლავიატურის ღილაკის დაჭერისას. keydown document-ზე ემატება (გლობალურად), click კი კონკრეტულ ელემენტზე."
      },
      {
        section: 'main',
        topic: 'classList.toggle',
        question: "რას აკეთებს classList.toggle('active')?",
        code: null,
        options: [
          "ამატებს 'active' კლასს",
          "შლის 'active' კლასს",
          "ამატებს თუ არ აქვს, შლის თუ აქვს",
          "ამოწმებს აქვს თუ არა 'active' კლასი"
        ],
        correct: 2,
        explanation: "toggle არის add და remove-ის კომბინაცია: თუ ელემენტს აქვს კლასი — წაშლის, თუ არ აქვს — დაამატებს. ეს კარგია on/off ტიპის ფუნქციონალისთვის."
      },
      {
        section: 'main',
        topic: 'Event Object',
        question: "რას წარმოადგენს 'e' პარამეტრი ივენთ ჰენდლერში?",
        code: `document.addEventListener('keydown', function(e) {
  console.log(e);
});`,
        options: [
          "HTML ელემენტს",
          "ივენთ ობიექტს — ინფორმაციას მომხდარი მოვლენის შესახებ",
          "შეცდომის ობიექტს",
          "ბრაუზერის ობიექტს"
        ],
        correct: 1,
        explanation: "ბრაუზერი ავტომატურად ქმნის ივენთ ობიექტს და გადასცემს callback ფუნქციას პირველ არგუმენტად. ეს ობიექტი შეიცავს ინფორმაციას: e.key (ღილაკი), e.target (ელემენტი), e.type (ივენთის ტიპი) და სხვა."
      },
      {
        section: 'main',
        topic: 'Conditional Close',
        question: "რატომ ვამოწმებთ !modal.classList.contains('hidden') Escape-ის ჰენდლერში?",
        code: `if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
  closeModal();
}`,
        options: [
          "სინტაქსური მოთხოვნაა",
          "რომ closeModal მხოლოდ მაშინ გამოვიძახოთ, როცა მოდალი გახსნილია",
          "რომ Escape მხოლოდ ერთხელ იმუშაოს",
          "classList.contains ივენთს აჩერებს"
        ],
        correct: 1,
        explanation: "Escape ღილაკი ყოველთვის ფაიერდება, არა მხოლოდ მოდალის გახსნისას. შემოწმების გარეშე closeModal ყოველ Escape-ზე შესრულდებოდა, რაც შეცდომებს გამოიწვევდა. !contains('hidden') ნიშნავს 'მოდალი ამჟამად ხილვადია'."
      }
    ];

    // State
    let currentIndex = 0;
    let answers = new Array(questions.length).fill(null);

    // DOM elements
    const progressBar = document.getElementById('progressBar');
    const questionCounter = document.getElementById('questionCounter');
    const questionCard = document.getElementById('questionCard');
    const sectionLabel = document.getElementById('sectionLabel');
    const questionText = document.getElementById('questionText');
    const codeBlock = document.getElementById('codeBlock');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const explanationBox = document.getElementById('explanationBox');
    const explanationText = document.getElementById('explanationText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionArea = document.getElementById('questionArea');
    const resultsScreen = document.getElementById('resultsScreen');

    function renderQuestion() {
      const q = questions[currentIndex];
      const total = questions.length;

      // Progress
      progressBar.style.width = ((currentIndex + 1) / total * 100) + '%';
      questionCounter.textContent = `კითხვა ${currentIndex + 1} / ${total}`;

      // Section label
      sectionLabel.textContent = `ძირითადი - ${q.topic}`;
      sectionLabel.className = 'section-label main';

      // Question text
      questionText.innerHTML = q.question;

      // Code block
      if (q.code) {
        codeBlock.textContent = q.code;
        codeBlock.classList.remove('hidden');
      } else {
        codeBlock.classList.add('hidden');
      }

      // Options
      optionsContainer.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = opt;
        const answered = answers[currentIndex] !== null;

        if (answered) {
          btn.classList.add('disabled');
          if (i === q.correct) {
            btn.classList.add('correct-answer');
          }
          if (answers[currentIndex] === i && i !== q.correct) {
            btn.classList.add('wrong-answer');
          }
        } else {
          btn.addEventListener('click', () => selectAnswer(i));
        }

        optionsContainer.appendChild(btn);
      });

      // Feedback
      if (answers[currentIndex] !== null) {
        feedback.classList.add('show');
        if (answers[currentIndex] === q.correct) {
          feedback.className = 'feedback show correct';
          feedback.textContent = 'სწორია! ';
          questionCard.classList.remove('incorrect');
          questionCard.classList.add('correct');
        } else {
          feedback.className = 'feedback show incorrect';
          feedback.textContent = 'არასწორია! სწორი პასუხი მონიშნულია მწვანედ.';
          questionCard.classList.remove('correct');
          questionCard.classList.add('incorrect');
        }
      } else {
        feedback.className = 'feedback';
        feedback.classList.remove('show');
        questionCard.classList.remove('correct', 'incorrect');
      }

      if (answers[currentIndex] !== null && q.explanation) {
        explanationText.textContent = q.explanation;
        explanationBox.classList.add('visible');
      } else {
        explanationBox.classList.remove('visible');
      }

      // Nav buttons
      prevBtn.disabled = currentIndex === 0;
      if (currentIndex === total - 1) {
        nextBtn.textContent = 'შედეგები →';
      } else {
        nextBtn.textContent = 'შემდეგი →';
      }
    }

    function selectAnswer(index) {
      answers[currentIndex] = index;
      renderQuestion();
    }

    function navigate(dir) {
      if (dir === 1 && currentIndex === questions.length - 1) {
        showResults();
        return;
      }
      currentIndex += dir;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= questions.length) currentIndex = questions.length - 1;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showResults() {
      questionArea.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      let totalCorrect = 0;

      questions.forEach((q, i) => {
        if (answers[i] === q.correct) {
          totalCorrect++;
        }
      });

      const percent = Math.round(totalCorrect / questions.length * 100);
      const scoreCircle = document.getElementById('scoreCircle');
      const scorePercent = document.getElementById('scorePercent');
      const scoreLabel = document.getElementById('scoreLabel');
      const scoreBreakdown = document.getElementById('scoreBreakdown');

      scorePercent.textContent = percent + '%';

      if (percent >= 80) {
        scoreCircle.className = 'score-circle excellent';
        scoreLabel.textContent = 'შესანიშნავი!';
      } else if (percent >= 50) {
        scoreCircle.className = 'score-circle good';
        scoreLabel.textContent = 'კარგია!';
      } else {
        scoreCircle.className = 'score-circle needs-work';
        scoreLabel.textContent = 'გაიმეორე მასალა';
      }

      scoreBreakdown.innerHTML = `
        <strong>სულ:</strong> ${totalCorrect} / ${questions.length} სწორი პასუხი
      `;
    }

    function restartQuiz() {
      currentIndex = 0;
      answers = new Array(questions.length).fill(null);
      resultsScreen.classList.add('hidden');
      questionArea.classList.remove('hidden');
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Init
    renderQuestion();
  </script>
</body>
</html>
