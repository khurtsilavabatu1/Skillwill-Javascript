<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OOP JavaScript-ში - ქვიზი</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .quiz-container {
      max-width: 750px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #e94560;
      margin-bottom: 0.4rem;
      font-size: 1.6rem;
      line-height: 1.35;
    }

    .subtitle {
      text-align: center;
      color: #7f8fa6;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .progress-bar-track {
      background: #16213e;
      border-radius: 8px;
      height: 10px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #e94560, #0f3460);
      height: 100%;
      border-radius: 8px;
      transition: width 0.4s ease;
    }

    .question-counter {
      text-align: center;
      margin-bottom: 1rem;
      color: #7f8fa6;
      font-size: 0.95rem;
    }

    .section-label {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-label.main {
      background: #0f3460;
      color: #63b3ed;
    }

    .question-card {
      background: #16213e;
      border-radius: 12px;
      padding: 2rem;
      border: 2px solid #0f3460;
      transition: border-color 0.3s ease;
    }

    .question-card.correct {
      border-color: #38a169;
    }

    .question-card.incorrect {
      border-color: #e53e3e;
    }

    .question-text {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      line-height: 1.55;
    }

    pre.code-block {
      background: #0d1b2a;
      border: 1px solid #1b3a5c;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      overflow-x: auto;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #a8d8a8;
      white-space: pre;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: #1a1a2e;
      border: 2px solid #2c3e6b;
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      color: #e0e0e0;
      font-size: 0.97rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      line-height: 1.45;
    }

    .option-btn:hover:not(.disabled) {
      background: #0f3460;
      border-color: #4a6fa5;
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: #63b3ed;
      background: #1a365d;
    }

    .option-btn.correct-answer {
      border-color: #38a169;
      background: #1c3a2a;
      color: #9ae6b4;
    }

    .option-btn.wrong-answer {
      border-color: #e53e3e;
      background: #3a1c1c;
      color: #feb2b2;
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.75;
    }

    .option-btn.disabled.correct-answer {
      opacity: 1;
    }

    .feedback {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: #1c3a2a;
      color: #68d391;
      border: 1px solid #38a169;
    }

    .feedback.incorrect {
      background: #3a1c1c;
      color: #fc8181;
      border: 1px solid #e53e3e;
    }

    .explanation-box {
      background: #0d1b2a;
      border-left: 4px solid #e94560;
      padding: 1rem 1.2rem;
      margin-top: 0.8rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.92rem;
      color: #b0bec5;
      line-height: 1.6;
      display: none;
    }

    .explanation-box.visible {
      display: block;
    }

    .explanation-box .explanation-title {
      font-weight: 700;
      color: #e94560;
      margin-bottom: 0.3rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      gap: 1rem;
    }

    .nav-btn {
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn.prev {
      background: #2c3e6b;
      color: #e0e0e0;
    }

    .nav-btn.prev:hover {
      background: #3a5298;
    }

    .nav-btn.next {
      background: #e94560;
      color: #fff;
    }

    .nav-btn.next:hover {
      background: #c73652;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .results-screen {
      background: #16213e;
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      border: 2px solid #0f3460;
    }

    .results-screen h2 {
      color: #e94560;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      border: 6px solid;
    }

    .score-circle.excellent {
      border-color: #38a169;
      color: #68d391;
      background: #1c3a2a;
    }

    .score-circle.good {
      border-color: #d69e2e;
      color: #f6e05e;
      background: #3a351c;
    }

    .score-circle.needs-work {
      border-color: #e53e3e;
      color: #fc8181;
      background: #3a1c1c;
    }

    .score-circle .score-label {
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    .score-breakdown {
      margin: 1.5rem 0;
      font-size: 1rem;
      color: #a0aec0;
      line-height: 2;
    }

    .score-breakdown strong {
      color: #e0e0e0;
    }

    .restart-btn {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .restart-btn:hover {
      background: #c73652;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      .question-card {
        padding: 1.3rem;
      }
      pre.code-block {
        font-size: 0.8rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>ობიექტზე ორიენტირებული პროგრამირება<br />OOP - ქვიზი</h1>
    <p class="subtitle">Object-Oriented Programming Quiz</p>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
    </div>

    <div id="questionArea">
      <p class="question-counter" id="questionCounter"></p>

      <div class="question-card" id="questionCard">
        <span class="section-label main" id="sectionLabel"></span>
        <div class="question-text" id="questionText"></div>
        <pre class="code-block hidden" id="codeBlock"></pre>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-title">ახსნა</div>
          <div id="explanationText"></div>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)">&#8592; წინა</button>
        <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">შემდეგი &#8594;</button>
      </div>
    </div>

    <div class="results-screen hidden" id="resultsScreen">
      <h2>ქვიზი დასრულებულია!</h2>
      <div class="score-circle" id="scoreCircle">
        <span id="scorePercent"></span>
        <span class="score-label" id="scoreLabel"></span>
      </div>
      <div class="score-breakdown" id="scoreBreakdown"></div>
      <button class="restart-btn" onclick="restartQuiz()">&#x1F504; თავიდან დაწყება</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        topic: 'OOP Principles',
        question: "OOP-ის რომელი პრინციპი გულისხმობს თვისებებისა და მეთოდების პრივატულად შენახვას კლასის შიგნით?",
        code: null,
        options: [
          "აბსტრაქცია (Abstraction)",
          "ენკაფსულაცია (Encapsulation)",
          "მემკვიდრეობა (Inheritance)",
          "პოლიმორფიზმი (Polymorphism)"
        ],
        correct: 1,
        explanation: "ენკაფსულაცია (Encapsulation) ნიშნავს თვისებებისა და მეთოდების პრივატულად შენახვას კლასის შიგნით, რათა გარედან არ იყოს ხელმისაწვდომი. ზოგიერთი მეთოდი გაცხადებულია საჯარო ინტერფეისად (API). ეს იცავს შიდა მდგომარეობას შემთხვევითი მანიპულაციისგან."
      },
      {
        topic: 'Constructor Functions',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const Car = function(make, speed) {
  this.make = make;
  this.speed = speed;
};

const bmw = new Car('BMW', 120);
console.log(bmw.make);`,
        options: [
          "undefined",
          "'BMW'",
          "Error",
          "'Car'"
        ],
        correct: 1,
        explanation: "new ოპერატორით Car constructor ფუნქციის გამოძახებისას: 1) ცარიელი ობიექტი იქმნება, 2) this ამ ობიექტზე მიუთითებს, 3) this.make = 'BMW' ინიშნება, 4) ობიექტი ავტომატურად ბრუნდება. bmw.make აბრუნებს 'BMW'."
      },
      {
        topic: 'new Operator',
        question: "რა ხდება კულისებს მიღმა, როცა <code>new</code> ოპერატორს ვიძახებთ? (სწორი თანმიმდევრობა)",
        code: null,
        options: [
          "ფუნქცია გამოიძახება → ობიექტი იქმნება → this მინიჭდება → return",
          "ობიექტი {} იქმნება → this = {} → ფუნქცია სრულდება → __proto__ უკავშირდება → ობიექტი ბრუნდება",
          "კლასი იქმნება → მეთოდები კოპირდება → ობიექტი ბრუნდება",
          "this = window → ფუნქცია სრულდება → ობიექტი ბრუნდება"
        ],
        correct: 1,
        explanation: "new ოპერატორის 4 ნაბიჯი: 1) ახალი ცარიელი ობიექტი {} იქმნება, 2) ფუნქცია გამოიძახება და this = ახალი ობიექტი, 3) ობიექტის __proto__ უკავშირდება constructor-ის prototype-ს, 4) ფუნქცია ავტომატურად აბრუნებს ახალ ობიექტს."
      },
      {
        topic: 'Constructor Functions',
        question: "რატომ არ უნდა შევქმნათ მეთოდები constructor ფუნქციის შიგნით?",
        code: `const Person = function(name) {
  this.name = name;
  this.greet = function() {
    console.log('Hello ' + this.name);
  };
};`,
        options: [
          "სინტაქსურად არასწორია",
          "ყოველი ინსტანცია მეთოდის საკუთარ ასლს მიიღებს — ცუდია წარმადობისთვის",
          "მეთოდი არ იმუშავებს",
          "this არ იქნება ხელმისაწვდომი მეთოდში"
        ],
        correct: 1,
        explanation: "constructor-ში მეთოდის შექმნისას ყოველი new Person() გამოძახება ახალ ფუნქციის ობიექტს შექმნის მეხსიერებაში. 1000 ინსტანციის შემთხვევაში 1000 იდენტური ფუნქცია იარსებებს. ამის ნაცვლად, მეთოდი Person.prototype-ზე უნდა განისაზღვროს — ასე ყველა ინსტანცია ერთ ფუნქციას იზიარებს."
      },
      {
        topic: 'Prototypes',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const Person = function(name) {
  this.name = name;
};
Person.prototype.greet = function() {
  return 'Hi, I am ' + this.name;
};

const jonas = new Person('Jonas');
console.log(jonas.greet());
console.log(jonas.hasOwnProperty('greet'));`,
        options: [
          "'Hi, I am Jonas' და true",
          "'Hi, I am Jonas' და false",
          "'Hi, I am undefined' და false",
          "Error"
        ],
        correct: 1,
        explanation: "jonas.greet() მუშაობს პროტოტიპის ჯაჭვის წყალობით — greet მეთოდი Person.prototype-ზეა, არა jonas ობიექტზე პირდაპირ. ამიტომ hasOwnProperty('greet') აბრუნებს false-ს. მეთოდი არ არის jonas-ის 'საკუთარი' თვისება, ის პროტოტიპიდან მემკვიდრეობით მიიღო."
      },
      {
        topic: 'Prototypes',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const Person = function(name) {
  this.name = name;
};

const jonas = new Person('Jonas');
console.log(jonas.__proto__ === Person.prototype);`,
        options: [
          "false",
          "true",
          "undefined",
          "Error"
        ],
        correct: 1,
        explanation: "new ოპერატორის მე-3 ნაბიჯში ახალი ობიექტის __proto__ უკავშირდება constructor-ის prototype თვისებას. ამიტომ jonas.__proto__ === Person.prototype არის true. მნიშვნელოვანი: Person.prototype არ არის Person-ის პროტოტიპი — ის არის პროტოტიპი Person-ით შექმნილი ობიექტებისთვის."
      },
      {
        topic: 'Prototype Chain',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const Person = function(name) {
  this.name = name;
};
const jonas = new Person('Jonas');

console.log(jonas.__proto__.__proto__ === Object.prototype);
console.log(jonas.__proto__.__proto__.__proto__);`,
        options: [
          "true და Object.prototype",
          "false და null",
          "true და null",
          "true და undefined"
        ],
        correct: 2,
        explanation: "პროტოტიპის ჯაჭვი: jonas → Person.prototype → Object.prototype → null. jonas.__proto__ = Person.prototype, jonas.__proto__.__proto__ = Object.prototype (true). Object.prototype-ის __proto__ არის null — ეს არის ჯაჭვის დასასრული."
      },
      {
        topic: 'Prototype Chain',
        question: "როცა jonas.hasOwnProperty('name') ვიძახებთ, სად იპოვის JavaScript hasOwnProperty მეთოდს?",
        code: `const Person = function(name) {
  this.name = name;
};
const jonas = new Person('Jonas');
jonas.hasOwnProperty('name');`,
        options: [
          "jonas ობიექტზე",
          "Person.prototype-ზე",
          "Object.prototype-ზე",
          "window ობიექტზე"
        ],
        correct: 2,
        explanation: "JavaScript ჯერ ეძებს jonas-ზე — ვერ იპოვის. შემდეგ Person.prototype-ზე — ვერ იპოვის. შემდეგ Object.prototype-ზე — იპოვის! hasOwnProperty მეთოდი Object.prototype-ზეა განსაზღვრული და ყველა ობიექტი პროტოტიპის ჯაჭვის მეშვეობით მემკვიდრეობით იღებს."
      },
      {
        topic: 'instanceof',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const Car = function(make) {
  this.make = make;
};

const bmw = new Car('BMW');
console.log(bmw instanceof Car);
console.log(bmw instanceof Object);
console.log({} instanceof Car);`,
        options: [
          "true, true, true",
          "true, true, false",
          "true, false, false",
          "false, true, false"
        ],
        correct: 1,
        explanation: "bmw instanceof Car → true (bmw შეიქმნა Car constructor-ით). bmw instanceof Object → true (ყველა ობიექტი Object-ის ინსტანციაა პროტოტიპის ჯაჭვის მეშვეობით). {} instanceof Car → false (ცარიელი ობიექტ ლიტერალი Car-ით არ შექმნილა)."
      },
      {
        topic: 'Static Methods',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const Person = function(name) {
  this.name = name;
};

Person.isHuman = function() {
  return true;
};

const jonas = new Person('Jonas');
console.log(Person.isHuman());
console.log(jonas.isHuman());`,
        options: [
          "true და true",
          "true და TypeError",
          "TypeError და true",
          "true და false"
        ],
        correct: 1,
        explanation: "Person.isHuman არის სტატიკური მეთოდი — ის ეკუთვნის Person constructor ფუნქციას, არა მის ინსტანციებს. Person.isHuman() მუშაობს. jonas.isHuman() იწვევს TypeError-ს, რადგან ინსტანციებს სტატიკური მეთოდები არ მემკვიდრეობს (ისინი prototype-ზე არ არის)."
      },
      {
        topic: 'Static Methods',

    let currentIndex = 0;
    let answers = new Array(questions.length).fill(null);

    const progressBar = document.getElementById('progressBar');
    const questionCounter = document.getElementById('questionCounter');
    const questionCard = document.getElementById('questionCard');
    const sectionLabel = document.getElementById('sectionLabel');
    const questionText = document.getElementById('questionText');
    const codeBlock = document.getElementById('codeBlock');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const explanationBox = document.getElementById('explanationBox');
    const explanationText = document.getElementById('explanationText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionArea = document.getElementById('questionArea');
    const resultsScreen = document.getElementById('resultsScreen');

    function renderQuestion() {
      const q = questions[currentIndex];
      const total = questions.length;

      progressBar.style.width = ((currentIndex + 1) / total * 100) + '%';
      questionCounter.textContent = `შეკითხვა ${currentIndex + 1} / ${total}`;

      sectionLabel.textContent = q.topic;
      sectionLabel.className = 'section-label main';

      questionText.innerHTML = q.question;

      if (q.code) {
        codeBlock.textContent = q.code;
        codeBlock.classList.remove('hidden');
      } else {
        codeBlock.classList.add('hidden');
      }

      optionsContainer.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = opt;
        const answered = answers[currentIndex] !== null;

        if (answered) {
          btn.classList.add('disabled');
          if (i === q.correct) btn.classList.add('correct-answer');
          if (answers[currentIndex] === i && i !== q.correct) btn.classList.add('wrong-answer');
        } else {
          btn.addEventListener('click', () => selectAnswer(i));
        }
        optionsContainer.appendChild(btn);
      });

      if (answers[currentIndex] !== null) {
        feedback.classList.add('show');
        if (answers[currentIndex] === q.correct) {
          feedback.className = 'feedback show correct';
          feedback.textContent = 'სწორია! ';
          questionCard.classList.remove('incorrect');
          questionCard.classList.add('correct');
        } else {
          feedback.className = 'feedback show incorrect';
          feedback.textContent = 'არასწორია! სწორი პასუხი მონიშნულია მწვანედ.';
          questionCard.classList.remove('correct');
          questionCard.classList.add('incorrect');
        }
      } else {
        feedback.className = 'feedback';
        feedback.classList.remove('show');
        questionCard.classList.remove('correct', 'incorrect');
      }

      if (answers[currentIndex] !== null && q.explanation) {
        explanationText.textContent = q.explanation;
        explanationBox.classList.add('visible');
      } else {
        explanationBox.classList.remove('visible');
      }

      prevBtn.disabled = currentIndex === 0;
      nextBtn.textContent = currentIndex === total - 1 ? 'შედეგები →' : 'შემდეგი →';
    }

    function selectAnswer(index) {
      answers[currentIndex] = index;
      renderQuestion();
    }

    function navigate(dir) {
      if (dir === 1 && currentIndex === questions.length - 1) {
        showResults();
        return;
      }
      currentIndex += dir;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= questions.length) currentIndex = questions.length - 1;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showResults() {
      questionArea.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      let totalCorrect = 0;
      questions.forEach((q, i) => {
        if (answers[i] === q.correct) totalCorrect++;
      });

      const percent = Math.round(totalCorrect / questions.length * 100);
      const scoreCircle = document.getElementById('scoreCircle');
      const scorePercent = document.getElementById('scorePercent');
      const scoreLabel = document.getElementById('scoreLabel');
      const scoreBreakdown = document.getElementById('scoreBreakdown');

      scorePercent.textContent = percent + '%';

      if (percent >= 80) {
        scoreCircle.className = 'score-circle excellent';
        scoreLabel.textContent = 'შესანიშნავი!';
      } else if (percent >= 50) {
        scoreCircle.className = 'score-circle good';
        scoreLabel.textContent = 'კარგია!';
      } else {
        scoreCircle.className = 'score-circle needs-work';
        scoreLabel.textContent = 'გაიმეორე მასალა';
      }

      scoreBreakdown.innerHTML = `
        <strong>სულ:</strong> ${totalCorrect} / ${questions.length} სწორი პასუხი
      `;
    }

    function restartQuiz() {
      currentIndex = 0;
      answers = new Array(questions.length).fill(null);
      resultsScreen.classList.add('hidden');
      questionArea.classList.remove('hidden');
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderQuestion();
  </script>
