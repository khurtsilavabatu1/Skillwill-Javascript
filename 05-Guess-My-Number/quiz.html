<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOM მანიპულაცია - Guess My Number - ქვიზი</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .quiz-container {
      max-width: 750px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #e94560;
      margin-bottom: 0.4rem;
      font-size: 1.6rem;
      line-height: 1.35;
    }

    .subtitle {
      text-align: center;
      color: #7f8fa6;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .progress-bar-track {
      background: #16213e;
      border-radius: 8px;
      height: 10px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #e94560, #0f3460);
      height: 100%;
      border-radius: 8px;
      transition: width 0.4s ease;
    }

    .question-counter {
      text-align: center;
      margin-bottom: 1rem;
      color: #7f8fa6;
      font-size: 0.95rem;
    }

    .section-label {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-label.main {
      background: #0f3460;
      color: #63b3ed;
    }

    .question-card {
      background: #16213e;
      border-radius: 12px;
      padding: 2rem;
      border: 2px solid #0f3460;
      transition: border-color 0.3s ease;
    }

    .question-card.correct {
      border-color: #38a169;
    }

    .question-card.incorrect {
      border-color: #e53e3e;
    }

    .question-text {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      line-height: 1.55;
    }

    pre.code-block {
      background: #0d1b2a;
      border: 1px solid #1b3a5c;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      overflow-x: auto;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #a8d8a8;
      white-space: pre;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: #1a1a2e;
      border: 2px solid #2c3e6b;
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      color: #e0e0e0;
      font-size: 0.97rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      line-height: 1.45;
    }

    .option-btn:hover:not(.disabled) {
      background: #0f3460;
      border-color: #4a6fa5;
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: #63b3ed;
      background: #1a365d;
    }

    .option-btn.correct-answer {
      border-color: #38a169;
      background: #1c3a2a;
      color: #9ae6b4;
    }

    .option-btn.wrong-answer {
      border-color: #e53e3e;
      background: #3a1c1c;
      color: #feb2b2;
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.75;
    }

    .option-btn.disabled.correct-answer {
      opacity: 1;
    }

    .feedback {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: #1c3a2a;
      color: #68d391;
      border: 1px solid #38a169;
    }

    .feedback.incorrect {
      background: #3a1c1c;
      color: #fc8181;
      border: 1px solid #e53e3e;
    }

    .explanation-box {
      background: #0d1b2a;
      border-left: 4px solid #e94560;
      padding: 1rem 1.2rem;
      margin-top: 0.8rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.92rem;
      color: #b0bec5;
      line-height: 1.6;
      display: none;
    }

    .explanation-box.visible {
      display: block;
    }

    .explanation-box .explanation-title {
      font-weight: 700;
      color: #e94560;
      margin-bottom: 0.3rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      gap: 1rem;
    }

    .nav-btn {
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn.prev {
      background: #2c3e6b;
      color: #e0e0e0;
    }

    .nav-btn.prev:hover {
      background: #3a5298;
    }

    .nav-btn.next {
      background: #e94560;
      color: #fff;
    }

    .nav-btn.next:hover {
      background: #c73652;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Results screen */
    .results-screen {
      background: #16213e;
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      border: 2px solid #0f3460;
    }

    .results-screen h2 {
      color: #e94560;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      border: 6px solid;
    }

    .score-circle.excellent {
      border-color: #38a169;
      color: #68d391;
      background: #1c3a2a;
    }

    .score-circle.good {
      border-color: #d69e2e;
      color: #f6e05e;
      background: #3a351c;
    }

    .score-circle.needs-work {
      border-color: #e53e3e;
      color: #fc8181;
      background: #3a1c1c;
    }

    .score-circle .score-label {
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    .score-breakdown {
      margin: 1.5rem 0;
      font-size: 1rem;
      color: #a0aec0;
      line-height: 2;
    }

    .score-breakdown strong {
      color: #e0e0e0;
    }

    .restart-btn {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .restart-btn:hover {
      background: #c73652;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      .question-card {
        padding: 1.3rem;
      }
      pre.code-block {
        font-size: 0.8rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>DOM მანიპულაცია<br />Guess My Number - ქვიზი</h1>
    <p class="subtitle">15 კითხვა - DOM Manipulation Quiz</p>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
    </div>

    <!-- Question area -->
    <div id="questionArea">
      <p class="question-counter" id="questionCounter"></p>

      <div class="question-card" id="questionCard">
        <span class="section-label main" id="sectionLabel"></span>
        <div class="question-text" id="questionText"></div>
        <pre class="code-block hidden" id="codeBlock"></pre>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-title">ახსნა</div>
          <div id="explanationText"></div>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)">&#8592; წინა</button>
        <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">შემდეგი &#8594;</button>
      </div>
    </div>

    <!-- Results screen -->
    <div class="results-screen hidden" id="resultsScreen">
      <h2>ქვიზი დასრულებულია!</h2>
      <div class="score-circle" id="scoreCircle">
        <span id="scorePercent"></span>
        <span class="score-label" id="scoreLabel"></span>
      </div>
      <div class="score-breakdown" id="scoreBreakdown"></div>
      <button class="restart-btn" onclick="restartQuiz()">&#x1F504; თავიდან დაწყება</button>
    </div>
  </div>

  <script>
    const questions = [
      {
        section: 'main',
        topic: 'DOM',
        question: "რა არის DOM?",
        code: null,
        options: [
          "JavaScript ბიბლიოთეკა",
          "HTML დოკუმენტის ობიექტური წარმოდგენა, რომელიც JS-ს ელემენტებთან ურთიერთქმედების საშუალებას აძლევს",
          "CSS ფრეიმვორკი",
          "ბრაუზერის ძრავი"
        ],
        correct: 1,
        explanation: "DOM (Document Object Model) არის HTML დოკუმენტის სტრუქტურირებული, ხის მსგავსი წარმოდგენა. JavaScript-ს შეუძლია DOM-ის მეშვეობით ელემენტების შეცვლა, წაშლა და დამატება."
      },
      {
        section: 'main',
        topic: 'querySelector',
        question: "რას აბრუნებს document.querySelector('.message')?",
        code: null,
        options: [
          "ყველა .message კლასის ელემენტს",
          "პირველ ელემენტს .message კლასით",
          "ბოლო ელემენტს .message კლასით",
          "შეცდომას"
        ],
        correct: 1,
        explanation: "querySelector აბრუნებს პირველ ელემენტს, რომელიც შეესაბამება CSS სელექტორს. ყველას მისაღებად querySelectorAll უნდა გამოვიყენოთ."
      },
      {
        section: 'main',
        topic: 'textContent',
        question: "რას გამოიტანს ეს კოდი?",
        code: "document.querySelector('.message').textContent = 'Hello!';\nconsole.log(document.querySelector('.message').textContent);",
        options: [
          "undefined",
          "'Hello!'",
          "null",
          "Error"
        ],
        correct: 1,
        explanation: "textContent თვისება აყენებს ან აბრუნებს ელემენტის ტექსტურ შიგთავსს. ჯერ 'Hello!' მიენიჭა, შემდეგ იგივე წაიკითხა."
      },
      {
        section: 'main',
        topic: 'addEventListener',
        question: "რას აკეთებს addEventListener?",
        code: null,
        options: [
          "შლის ივენთ ჰენდლერს",
          "ამატებს ფუნქციას, რომელიც შესრულდება კონკრეტულ მოვლენაზე",
          "ქმნის ახალ HTML ელემენტს",
          "ცვლის CSS სტილს"
        ],
        correct: 1,
        explanation: "addEventListener ელემენტზე ამატებს მოსმენას კონკრეტული მოვლენისთვის (click, keydown და ა.შ.) და გადაცემულ ფუნქციას (callback) გაუშვებს მოვლენის მოხდენისას."
      },
      {
        section: 'main',
        topic: 'value',
        question: "როგორ ვიღებთ input ველის მნიშვნელობას?",
        code: "const guess = document.querySelector('.guess').value;",
        options: [
          ".textContent",
          ".value",
          ".innerHTML",
          ".innerText"
        ],
        correct: 1,
        explanation: "input ელემენტებისთვის .value თვისება გამოიყენება. textContent მხოლოდ ჩვეულებრივ ელემენტებზე მუშაობს (p, h1, span...), input-ს კი value აქვს."
      },
      {
        section: 'main',
        topic: 'Style Manipulation',
        question: "რას გამოიტანს ეს კოდი?",
        code: "document.querySelector('body').style.backgroundColor = '#60b347';",
        options: [
          "შეცდომას, რადგან backgroundColor არასწორი სახელია",
          "body ელემენტის ფონი გახდება მწვანე",
          "არაფერს — ინლაინ სტილი არ მუშაობს",
          "CSS ფაილი შეიცვლება"
        ],
        correct: 1,
        explanation: "JavaScript-ით სტილის შეცვლისას ინლაინ სტილი ემატება ელემენტს. CSS property-ების სახელები camelCase-ში იწერება: background-color → backgroundColor."
      },
      {
        section: 'main',
        topic: 'Math.random',
        question: "რას აკეთებს Math.trunc(Math.random() * 20) + 1?",
        code: null,
        options: [
          "გენერირებს 0-დან 20-მდე რიცხვს",
          "გენერირებს 1-დან 20-მდე მთელ რიცხვს",
          "გენერირებს 1-დან 21-მდე რიცხვს",
          "გენერირებს 0-დან 19-მდე რიცხვს"
        ],
        correct: 1,
        explanation: "Math.random() აბრუნებს 0-დან 1-მდე (1 არ შედის). გამრავლებული 20-ზე → 0-19.99. Math.trunc მოაცილებს ათწილადს → 0-19. +1 → 1-20."
      },
      {
        section: 'main',
        topic: 'Number Conversion',
        question: "რატომ გვჭირდება Number() ამ კოდში?",
        code: "const guess = Number(document.querySelector('.guess').value);",
        options: [
          "value ყოველთვის undefined-ს აბრუნებს",
          "value ყოველთვის string-ს აბრუნებს, Number() რიცხვში გადაიყვანს",
          "Number() სტრინგს აფორმატებს",
          "არ გვჭირდება, სურვილისამებრ არის"
        ],
        correct: 1,
        explanation: "input ელემენტის .value ყოველთვის string ტიპისაა, მაშინაც კი თუ type='number'. Number()-ით გარდაქმნა აუცილებელია რიცხვებთან შედარებისთვის (=== ტიპსაც ამოწმებს)."
      },
      {
        section: 'main',
        topic: 'Game State',
        question: "რატომ არის score ცვლადი addEventListener-ის გარეთ გამოცხადებული?",
        code: "let score = 20;\ndocument.querySelector('.check').addEventListener('click', function() {\n  score--;\n});",
        options: [
          "ამით ფუნქცია უფრო სწრაფად მუშაობს",
          "რომ ცვლადმა თავისი მნიშვნელობა შეინარჩუნოს ყოველ კლიკს შორის",
          "რადგან let მხოლოდ გლობალურ სკოუპში მუშაობს",
          "სინტაქსური მოთხოვნაა"
        ],
        correct: 1,
        explanation: "თუ score ფუნქციის შიგნით გამოვაცხადებთ, ყოველ კლიკზე ხელახლა შეიქმნება 20 მნიშვნელობით. გარეთ გამოცხადებით ის 'state' ცვლადია — ინარჩუნებს მნიშვნელობას კლიკებს შორის."
      },
      {
        section: 'main',
        topic: 'Refactoring',
        question: "რას ნიშნავს DRY პრინციპი?",
        code: null,
        options: [
          "Don't Repeat Yourself — არ გაიმეორო კოდი",
          "Debug, Refactor, Yield",
          "Data Rendering Yield",
          "Document Read Yourself"
        ],
        correct: 0,
        explanation: "DRY (Don't Repeat Yourself) ნიშნავს გამეორებადი კოდის თავიდან აცილებას. მაგალითად, displayMessage ფუნქცია ერთ ადგილას ცვლის .message-ს textContent-ს, ნაცვლად ყოველ ადგილას document.querySelector('.message').textContent-ის გამეორებისა."
      },
      {
        section: 'main',
        topic: 'DOM',
        question: "რას გამოიტანს ეს კოდი?",
        code: "document.querySelector('.number').style.width = '30rem';\nconsole.log(document.querySelector('.number').style.width);",
        options: [
          "undefined",
          "'30rem'",
          "30",
          "Error"
        ],
        correct: 1,
        explanation: "style.width ინლაინ სტილს აყენებს. წაკითხვისას იგივე მნიშვნელობას აბრუნებს სტრინგის სახით — '30rem'. ინლაინ სტილები ყოველთვის string-ებია."
      },
      {
        section: 'main',
        topic: 'Event Handler',
        question: "რატომ გადავცემთ ფუნქციას addEventListener-ს ფრჩხილების გარეშე?",
        code: "btn.addEventListener('click', handleClick);\n// და არა: btn.addEventListener('click', handleClick());",
        options: [
          "ორივე ვარიანტი ერთნაირად მუშაობს",
          "ფრჩხილებით ფუნქცია მაშინვე შესრულდება, არა კლიკზე",
          "ფრჩხილებით სინტაქსური შეცდომაა",
          "addEventListener ავტომატურად ამატებს ფრჩხილებს"
        ],
        correct: 1,
        explanation: "handleClick() ფრჩხილებით ფუნქციას მაშინვე შეასრულებს და შედეგს (undefined) გადასცემს addEventListener-ს. handleClick ფრჩხილების გარეშე თვითონ ფუნქციის მითითებას (reference) გადასცემს, რომ მოგვიანებით გამოიძახოს."
      },
      {
        section: 'main',
        topic: 'Conditional Logic',
        question: "რას გამოიტანს ეს კოდი?",
        code: "const guess = 0;\nif (!guess) {\n  console.log('No number!');\n} else {\n  console.log('Valid guess');\n}",
        options: [
          "'Valid guess'",
          "'No number!'",
          "undefined",
          "Error"
        ],
        correct: 1,
        explanation: "0 falsy მნიშვნელობაა JavaScript-ში. !0 === true, ამიტომ if ბლოკი შესრულდება. ეს პატერნი Guess My Number თამაშში გამოიყენება ცარიელი input-ის შესამოწმებლად (ცარიელი value რიცხვად გადაყვანისას 0 გახდება)."
      },
      {
        section: 'main',
        topic: 'Highscore',
        question: "რას აკეთებს ეს კოდი?",
        code: "if (score > highscore) {\n  highscore = score;\n  document.querySelector('.highscore').textContent = highscore;\n}",
        options: [
          "ყოველთვის ანახლებს highscore-ს",
          "ანახლებს highscore-ს მხოლოდ თუ ახალი score მეტია ძველ რეკორდზე",
          "ანახლებს score-ს highscore-ის მნიშვნელობით",
          "შლის highscore ელემენტს"
        ],
        correct: 1,
        explanation: "ეს კოდი ამოწმებს, აღემატება თუ არა მიმდინარე score არსებულ highscore-ს. მხოლოდ მაშინ ანახლებს — ეს არის 'ყველაზე მაღალი ქულის' შენახვის სტანდარტული ლოგიკა."
      },
      {
        section: 'main',
        topic: 'Reset',
        question: "init ფუნქციაში რატომ ვაბრუნებთ ყველაფერს საწყის მდგომარეობაში?",
        code: "document.querySelector('.again').addEventListener('click', function() {\n  score = 20;\n  secretNumber = Math.trunc(Math.random() * 20) + 1;\n  displayMessage('Start guessing...');\n  // ... reset styles\n});",
        options: [
          "რომ გვერდი გადაიტვირთოს",
          "რომ თამაში ახლიდან დაიწყოს გვერდის გადატვირთვის გარეშე",
          "რომ მეხსიერება გათავისუფლდეს",
          "სინტაქსური მოთხოვნაა"
        ],
        correct: 1,
        explanation: "init/reset ფუნქცია ყველა state ცვლადს და DOM ელემენტს აბრუნებს საწყის მდგომარეობაში. ეს საშუალებას აძლევს მოთამაშეს ახალი თამაში დაიწყოს გვერდის გადატვირთვის (reload) გარეშე."
      }
    ];

    // State
    let currentIndex = 0;
    let answers = new Array(questions.length).fill(null);

    // DOM elements
    const progressBar = document.getElementById('progressBar');
    const questionCounter = document.getElementById('questionCounter');
    const questionCard = document.getElementById('questionCard');
    const sectionLabel = document.getElementById('sectionLabel');
    const questionText = document.getElementById('questionText');
    const codeBlock = document.getElementById('codeBlock');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const explanationBox = document.getElementById('explanationBox');
    const explanationText = document.getElementById('explanationText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionArea = document.getElementById('questionArea');
    const resultsScreen = document.getElementById('resultsScreen');

    function renderQuestion() {
      const q = questions[currentIndex];
      const total = questions.length;

      // Progress
      progressBar.style.width = ((currentIndex + 1) / total * 100) + '%';
      questionCounter.textContent = `კითხვა ${currentIndex + 1} / ${total}`;

      // Section label
      sectionLabel.textContent = `ძირითადი - ${q.topic}`;
      sectionLabel.className = 'section-label main';

      // Question text
      questionText.innerHTML = q.question;

      // Code block
      if (q.code) {
        codeBlock.textContent = q.code;
        codeBlock.classList.remove('hidden');
      } else {
        codeBlock.classList.add('hidden');
      }

      // Options
      optionsContainer.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = opt;
        const answered = answers[currentIndex] !== null;

        if (answered) {
          btn.classList.add('disabled');
          if (i === q.correct) {
            btn.classList.add('correct-answer');
          }
          if (answers[currentIndex] === i && i !== q.correct) {
            btn.classList.add('wrong-answer');
          }
        } else {
          btn.addEventListener('click', () => selectAnswer(i));
        }

        optionsContainer.appendChild(btn);
      });

      // Feedback
      if (answers[currentIndex] !== null) {
        feedback.classList.add('show');
        if (answers[currentIndex] === q.correct) {
          feedback.className = 'feedback show correct';
          feedback.textContent = 'სწორია! ';
          questionCard.classList.remove('incorrect');
          questionCard.classList.add('correct');
        } else {
          feedback.className = 'feedback show incorrect';
          feedback.textContent = 'არასწორია! სწორი პასუხი მონიშნულია მწვანედ.';
          questionCard.classList.remove('correct');
          questionCard.classList.add('incorrect');
        }
      } else {
        feedback.className = 'feedback';
        feedback.classList.remove('show');
        questionCard.classList.remove('correct', 'incorrect');
      }

      if (answers[currentIndex] !== null && q.explanation) {
        explanationText.textContent = q.explanation;
        explanationBox.classList.add('visible');
      } else {
        explanationBox.classList.remove('visible');
      }

      // Nav buttons
      prevBtn.disabled = currentIndex === 0;
      if (currentIndex === total - 1) {
        nextBtn.textContent = 'შედეგები →';
      } else {
        nextBtn.textContent = 'შემდეგი →';
      }
    }

    function selectAnswer(index) {
      answers[currentIndex] = index;
      renderQuestion();
    }

    function navigate(dir) {
      if (dir === 1 && currentIndex === questions.length - 1) {
        showResults();
        return;
      }
      currentIndex += dir;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= questions.length) currentIndex = questions.length - 1;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showResults() {
      questionArea.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      let totalCorrect = 0;

      questions.forEach((q, i) => {
        if (answers[i] === q.correct) {
          totalCorrect++;
        }
      });

      const percent = Math.round(totalCorrect / questions.length * 100);
      const scoreCircle = document.getElementById('scoreCircle');
      const scorePercent = document.getElementById('scorePercent');
      const scoreLabel = document.getElementById('scoreLabel');
      const scoreBreakdown = document.getElementById('scoreBreakdown');

      scorePercent.textContent = percent + '%';

      if (percent >= 80) {
        scoreCircle.className = 'score-circle excellent';
        scoreLabel.textContent = 'შესანიშნავი!';
      } else if (percent >= 50) {
        scoreCircle.className = 'score-circle good';
        scoreLabel.textContent = 'კარგია!';
      } else {
        scoreCircle.className = 'score-circle needs-work';
        scoreLabel.textContent = 'გაიმეორე მასალა';
      }

      scoreBreakdown.innerHTML = `
        <strong>სულ:</strong> ${totalCorrect} / ${questions.length} სწორი პასუხი
      `;
    }

    function restartQuiz() {
      currentIndex = 0;
      answers = new Array(questions.length).fill(null);
      resultsScreen.classList.add('hidden');
      questionArea.classList.remove('hidden');
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Init
    renderQuestion();
  </script>
</body>
