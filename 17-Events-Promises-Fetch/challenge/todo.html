<!DOCTYPE html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App - ჩელენჯი</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f2f5;
        color: #333;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      h1 {
        text-align: center;
        margin-bottom: 24px;
        color: #3949ab;
        font-size: 28px;
      }

      /* ===== ფორმა ===== */
      .add-form {
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        display: flex;
        gap: 12px;
        margin-bottom: 28px;
        align-items: center;
      }

      .add-form input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        transition: border-color 0.2s;
        outline: none;
      }

      .add-form input[type="text"]:focus {
        border-color: #3949ab;
      }

      .add-form select {
        padding: 12px 16px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 15px;
        background: #fff;
        cursor: pointer;
        outline: none;
      }

      .add-form select:focus {
        border-color: #3949ab;
      }

      .add-form button {
        padding: 12px 24px;
        background: #3949ab;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s;
        white-space: nowrap;
      }

      .add-form button:hover {
        background: #283593;
      }

      /* ===== სექციები ===== */
      .sections {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      .section {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .section-header {
        padding: 16px 20px;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .section-header .count {
        background: rgba(255, 255, 255, 0.3);
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 14px;
      }

      .section.todo .section-header {
        background: #3949ab;
        color: #fff;
      }

      .section.todo .section-header .count {
        background: rgba(255, 255, 255, 0.25);
      }

      .section.backlog .section-header {
        background: #f57c00;
        color: #fff;
      }

      .section.backlog .section-header .count {
        background: rgba(255, 255, 255, 0.25);
      }

      .section-body {
        padding: 12px;
        min-height: 120px;
      }

      /* ===== ტასკები ===== */
      .task-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        margin-bottom: 8px;
        background: #f8f9fa;
        border-radius: 8px;
        border-left: 4px solid #3949ab;
        transition: transform 0.15s, box-shadow 0.15s;
      }

      .section.backlog .task-item {
        border-left-color: #f57c00;
      }

      .task-item:hover {
        transform: translateX(4px);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      }

      .task-title {
        flex: 1;
        font-size: 15px;
      }

      .task-actions {
        display: flex;
        gap: 6px;
      }

      .btn-move,
      .btn-delete {
        padding: 6px 12px;
        border: none;
        border-radius: 6px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }

      .btn-move:active,
      .btn-delete:active {
        transform: scale(0.95);
      }

      .btn-move {
        background: #e8eaf6;
        color: #3949ab;
      }

      .btn-move:hover {
        background: #c5cae9;
      }

      .btn-delete {
        background: #ffebee;
        color: #e53935;
      }

      .btn-delete:hover {
        background: #ffcdd2;
      }

      /* ===== ცარიელი სექცია ===== */
      .empty-message {
        text-align: center;
        color: #aaa;
        padding: 30px;
        font-size: 14px;
      }

      /* ===== შეცდომა / ჩატვირთვა ===== */
      .status-message {
        text-align: center;
        padding: 16px;
        margin-bottom: 20px;
        border-radius: 8px;
        font-size: 14px;
        display: none;
      }

      .status-message.loading {
        display: block;
        background: #e3f2fd;
        color: #1565c0;
      }

      .status-message.error {
        display: block;
        background: #ffebee;
        color: #c62828;
      }

      /* ===== რესპონსივი ===== */
      @media (max-width: 640px) {
        .sections {
          grid-template-columns: 1fr;
        }

        .add-form {
          flex-direction: column;
        }

        .add-form input[type="text"],
        .add-form select,
        .add-form button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Todo App</h1>

      <div id="statusMessage" class="status-message"></div>

      <form id="addForm" class="add-form">
        <input
          type="text"
          id="taskInput"
          placeholder="ახალი დავალება..."
          required
        />
        <select id="typeSelect">
          <option value="todo">Todo</option>
          <option value="backlog">Backlog</option>
        </select>
        <button type="submit">დამატება</button>
      </form>

      <div class="sections">
        <div class="section todo">
          <div class="section-header">
            Todo <span id="todoCount" class="count">0</span>
          </div>
          <div id="todoList" class="section-body">
            <p class="empty-message">ჩატვირთვა...</p>
          </div>
        </div>

        <div class="section backlog">
          <div class="section-header">
            Backlog <span id="backlogCount" class="count">0</span>
          </div>
          <div id="backlogList" class="section-body">
            <p class="empty-message">ჩატვირთვა...</p>
          </div>
        </div>
      </div>
    </div>

    <script src="todo.js"></script>
  </body>
</html>
