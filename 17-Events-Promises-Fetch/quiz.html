<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events, Promises & Fetch — ქვიზი</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .quiz-container {
      max-width: 750px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #e94560;
      margin-bottom: 0.4rem;
      font-size: 1.6rem;
      line-height: 1.35;
    }

    .subtitle {
      text-align: center;
      color: #7f8fa6;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .progress-bar-track {
      background: #16213e;
      border-radius: 8px;
      height: 10px;
      margin-bottom: 1.5rem;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, #e94560, #0f3460);
      height: 100%;
      border-radius: 8px;
      transition: width 0.4s ease;
    }

    .question-counter {
      text-align: center;
      margin-bottom: 1rem;
      color: #7f8fa6;
      font-size: 0.95rem;
    }

    .section-label {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section-label.main {
      background: #0f3460;
      color: #63b3ed;
    }

    .question-card {
      background: #16213e;
      border-radius: 12px;
      padding: 2rem;
      border: 2px solid #0f3460;
      transition: border-color 0.3s ease;
    }

    .question-card.correct {
      border-color: #38a169;
    }

    .question-card.incorrect {
      border-color: #e53e3e;
    }

    .question-text {
      font-size: 1.1rem;
      margin-bottom: 1.2rem;
      line-height: 1.55;
    }

    pre.code-block {
      background: #0d1b2a;
      border: 1px solid #1b3a5c;
      border-radius: 8px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      overflow-x: auto;
      font-family: 'Fira Code', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.88rem;
      line-height: 1.6;
      color: #a8d8a8;
      white-space: pre;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .option-btn {
      background: #1a1a2e;
      border: 2px solid #2c3e6b;
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      color: #e0e0e0;
      font-size: 0.97rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
      line-height: 1.45;
    }

    .option-btn:hover:not(.disabled) {
      background: #0f3460;
      border-color: #4a6fa5;
      transform: translateX(4px);
    }

    .option-btn.selected {
      border-color: #63b3ed;
      background: #1a365d;
    }

    .option-btn.correct-answer {
      border-color: #38a169;
      background: #1c3a2a;
      color: #9ae6b4;
    }

    .option-btn.wrong-answer {
      border-color: #e53e3e;
      background: #3a1c1c;
      color: #feb2b2;
    }

    .option-btn.disabled {
      cursor: default;
      opacity: 0.75;
    }

    .option-btn.disabled.correct-answer {
      opacity: 1;
    }

    .feedback {
      margin-top: 1rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      display: none;
    }

    .feedback.show {
      display: block;
    }

    .feedback.correct {
      background: #1c3a2a;
      color: #68d391;
      border: 1px solid #38a169;
    }

    .feedback.incorrect {
      background: #3a1c1c;
      color: #fc8181;
      border: 1px solid #e53e3e;
    }

    .explanation-box {
      background: #0d1b2a;
      border-left: 4px solid #e94560;
      padding: 1rem 1.2rem;
      margin-top: 0.8rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.92rem;
      color: #b0bec5;
      line-height: 1.6;
      display: none;
    }

    .explanation-box.visible {
      display: block;
    }

    .explanation-box .explanation-title {
      font-weight: 700;
      color: #e94560;
      margin-bottom: 0.3rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      margin-top: 1.5rem;
      gap: 1rem;
    }

    .nav-btn {
      padding: 0.7rem 1.6rem;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .nav-btn:active {
      transform: scale(0.97);
    }

    .nav-btn.prev {
      background: #2c3e6b;
      color: #e0e0e0;
    }

    .nav-btn.prev:hover {
      background: #3a5298;
    }

    .nav-btn.next {
      background: #e94560;
      color: #fff;
    }

    .nav-btn.next:hover {
      background: #c73652;
    }

    .nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .results-screen {
      background: #16213e;
      border-radius: 12px;
      padding: 2.5rem;
      text-align: center;
      border: 2px solid #0f3460;
    }

    .results-screen h2 {
      color: #e94560;
      margin-bottom: 1.5rem;
      font-size: 1.5rem;
    }

    .score-circle {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin: 0 auto 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 700;
      border: 6px solid;
    }

    .score-circle.excellent {
      border-color: #38a169;
      color: #68d391;
      background: #1c3a2a;
    }

    .score-circle.good {
      border-color: #d69e2e;
      color: #f6e05e;
      background: #3a351c;
    }

    .score-circle.needs-work {
      border-color: #e53e3e;
      color: #fc8181;
      background: #3a1c1c;
    }

    .score-circle .score-label {
      font-size: 0.85rem;
      font-weight: 400;
      margin-top: 0.2rem;
    }

    .score-breakdown {
      margin: 1.5rem 0;
      font-size: 1rem;
      color: #a0aec0;
      line-height: 2;
    }

    .score-breakdown strong {
      color: #e0e0e0;
    }

    .restart-btn {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 2.2rem;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .restart-btn:hover {
      background: #c73652;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem 0.5rem;
      }
      h1 {
        font-size: 1.25rem;
      }
      .question-card {
        padding: 1.3rem;
      }
      pre.code-block {
        font-size: 0.8rem;
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="quiz-container">
    <h1>Events, Promises & Fetch<br />ქვიზი</h1>
    <p class="subtitle">Events, Promises & Fetch Quiz</p>

    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progressBar" style="width: 0%"></div>
    </div>

    <div id="questionArea">
      <p class="question-counter" id="questionCounter"></p>

      <div class="question-card" id="questionCard">
        <span class="section-label main" id="sectionLabel"></span>
        <div class="question-text" id="questionText"></div>
        <pre class="code-block hidden" id="codeBlock"></pre>
        <div class="options" id="optionsContainer"></div>
        <div class="feedback" id="feedback"></div>
        <div class="explanation-box" id="explanationBox">
          <div class="explanation-title">ახსნა</div>
          <div id="explanationText"></div>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="nav-btn prev" id="prevBtn" onclick="navigate(-1)">&#8592; წინა</button>
        <button class="nav-btn next" id="nextBtn" onclick="navigate(1)">შემდეგი &#8594;</button>
      </div>
    </div>

    <div class="results-screen hidden" id="resultsScreen">
      <h2>ქვიზი დასრულებულია!</h2>
      <div class="score-circle" id="scoreCircle">
        <span id="scorePercent"></span>
        <span class="score-label" id="scoreLabel"></span>
      </div>
      <div class="score-breakdown" id="scoreBreakdown"></div>
      <button class="restart-btn" onclick="restartQuiz()">&#x1F504; თავიდან დაწყება</button>
    </div>
  </div>

  <script>
    const questions = [
      // ===== addEventListener / removeEventListener (2) =====
      {
        topic: 'addEventListener / removeEventListener',
        question: "რატომ ვერ წაშლის removeEventListener ანონიმურ ფუნქციას?",
        code: `btn.addEventListener("click", function () {
  console.log("Clicked!");
});

btn.removeEventListener("click", function () {
  console.log("Clicked!");
});`,
        options: [
          "removeEventListener მხოლოდ arrow ფუნქციებთან მუშაობს",
          "ორი ანონიმური ფუნქცია სხვადასხვა რეფერენსია — removeEventListener ვერ პოულობს ორიგინალს",
          "removeEventListener-ს event type არ სჭირდება",
          "ანონიმური ფუნქციები ავტომატურად იშლება და removeEventListener საჭირო არ არის"
        ],
        correct: 1,
        explanation: "ორი ერთნაირი ანონიმური ფუნქცია სხვადასხვა ობიექტია მეხსიერებაში. removeEventListener-ს ზუსტად იგივე ფუნქციის რეფერენსი სჭირდება, ამიტომ named function-ის გამოყენებაა აუცილებელი."
      },
      {
        topic: 'addEventListener / removeEventListener',
        question: "რას აკეთებს { once: true } ოფცია addEventListener-ში?",
        code: `btn.addEventListener("click", function () {
  console.log("დაიჭირა!");
}, { once: true });`,
        options: [
          "listener მხოლოდ ერთხელ გაეშვება, შემდეგ ავტომატურად წაიშლება",
          "listener მხოლოდ პირველ ელემენტზე იმუშავებს",
          "listener-ს 1 წამიანი დაყოვნება ექნება",
          "listener capturing ფაზაში გაეშვება"
        ],
        correct: 0,
        explanation: "{ once: true } ოფცია listener-ს ერთჯერადს ხდის — პირველი გაშვების შემდეგ ის ავტომატურად წაიშლება. ეს ეკვივალენტურია listener-ის ხელით წაშლის handler-ის შიგნით."
      },
      // ===== DOM Events (2) =====
      {
        topic: 'DOM Events',
        question: "რა განსხვავებაა e.key-სა და e.code-ს შორის keydown ხდომილობისას?",
        code: `document.addEventListener("keydown", function (e) {
  console.log("Key:", e.key);   // ?
  console.log("Code:", e.code); // ?
});`,
        options: [
          "e.key აბრუნებს ფიზიკურ კლავიშს, e.code — სიმბოლოს",
          "e.key აბრუნებს სიმბოლოს (განსხვავდება ენის მიხედვით), e.code — ფიზიკურ კლავიშს (ყოველთვის ერთი და იგივე)",
          "განსხვავება არ არის — ორივე ერთსა და იმავეს აბრუნებს",
          "e.key მხოლოდ ასოებს აბრუნებს, e.code — ნებისმიერ კლავიშს"
        ],
        correct: 1,
        explanation: "e.key აბრუნებს დაჭერილ სიმბოლოს (მაგ. 'a', 'Enter') და დამოკიდებულია კლავიატურის განლაგებაზე. e.code აბრუნებს ფიზიკური კლავიშის იდენტიფიკატორს (მაგ. 'KeyA', 'Enter') და არ იცვლება ენის მიხედვით."
      },
      {
        topic: 'DOM Events',
        question: "რა განსხვავებაა input და change ხდომილობებს შორის და რას აკეთებს e.preventDefault()?",
        code: `const input = document.getElementById("search");

input.addEventListener("input", function (e) {
  console.log("input:", e.target.value);
});

input.addEventListener("change", function (e) {
  console.log("change:", e.target.value);
});`,
        options: [
          "input ეშვება ფოკუსის წასვლისას, change — ყოველ სიმბოლოზე",
          "input ეშვება ყოველ სიმბოლოზე (real-time), change — ფოკუსის წასვლისას, თუ მნიშვნელობა შეიცვალა. e.preventDefault() აუქმებს ბრაუზერის default ქცევას",
          "ორივე ერთნაირად მუშაობს, e.preventDefault() გვერდს ატვირთავს",
          "input მხოლოდ ტექსტურ ველებში მუშაობს, change — ყველგან"
        ],
        correct: 1,
        explanation: "input ხდომილობა real-time-ში ეშვება ყოველ ცვლილებაზე. change ეშვება მხოლოდ მაშინ, როცა ველიდან ფოკუსი წავიდა და მნიშვნელობა შეცვლილია. e.preventDefault() ბრაუზერის default ქცევას აუქმებს (მაგ. ფორმის submit-ისას გვერდის გადატვირთვას)."
      },
      // ===== Dynamic DOM & Style (2) =====
      {
        topic: 'Dynamic DOM & Style',
        question: "რას გააკეთებს classList.toggle() მეთოდი?",
        code: `const el = document.getElementById("box");
el.classList.add("active");

el.classList.toggle("active");
console.log(el.classList.contains("active")); // ?

el.classList.toggle("active");
console.log(el.classList.contains("active")); // ?`,
        options: [
          "true, true",
          "false, false",
          "false, true",
          "Error — toggle მეთოდი არ არსებობს"
        ],
        correct: 2,
        explanation: "toggle თუ კლასი უკვე არსებობს — წაშლის, თუ არ არსებობს — დაამატებს. პირველი toggle \"active\"-ს წაშლის (false), მეორე toggle ისევ დაამატებს (true)."
      },
      {
        topic: 'Dynamic DOM & Style',
        question: "რა განსხვავებაა textContent-სა და innerHTML-ს შორის, და სად ამატებს insertAdjacentHTML(\"afterbegin\", ...) ელემენტს?",
        code: `const el = document.getElementById("box");

el.textContent = "<b>Bold</b>";  // ?
el.innerHTML = "<b>Bold</b>";    // ?

const list = document.getElementById("list");
list.insertAdjacentHTML("afterbegin", "<li>First</li>");`,
        options: [
          "ორივე ერთნაირად აჩვენებს Bold ტექსტს. insertAdjacentHTML ელემენტის შემდეგ ამატებს",
          "textContent ტეგებს ტექსტად აჩვენებს, innerHTML HTML-ად დაამუშავებს. insertAdjacentHTML ელემენტის შიგნით თავში ამატებს",
          "textContent HTML-ად დაამუშავებს, innerHTML ტექსტად აჩვენებს",
          "textContent უსაფრთხოა XSS-ისგან, innerHTML — არა, მაგრამ ორივე ერთნაირ შედეგს იძლევა"
        ],
        correct: 1,
        explanation: "textContent ტექსტს ისე აჩვენებს, როგორც არის — HTML ტეგები არ მუშავდება (უსაფრთხო). innerHTML ტეგებს HTML-ად დაამუშავებს (XSS რისკი user input-ზე). insertAdjacentHTML(\"afterbegin\") ელემენტის შიგნით, თავში ჩასვამს ახალ HTML-ს."
      },
      // ===== Promise (3) =====
      {
        topic: 'Promise',
        question: "Promise-ს რამდენი მდგომარეობა აქვს და რომელია ისინი?",
        code: null,
        options: [
          "2 — resolved და rejected",
          "3 — pending, fulfilled, rejected",
          "4 — pending, resolved, rejected, completed",
          "3 — waiting, success, error"
        ],
        correct: 1,
        explanation: "Promise-ს ზუსტად სამი მდგომარეობა აქვს: pending (ჯერ მუშაობს), fulfilled (წარმატებით დასრულდა resolve()-ით), rejected (შეცდომით დასრულდა reject()-ით). fulfilled და rejected ერთობლივად \"settled\" ეწოდება."
      },
      {
        topic: 'Promise',
        question: "რას გამოიტანს ეს კოდი?",
        code: `const p = new Promise(function (resolve, reject) {
  resolve("A");
});

p.then(function (val) {
  console.log(val);
  return "B";
}).then(function (val) {
  console.log(val);
}).catch(function (err) {
  console.log("Error:", err);
}).finally(function () {
  console.log("Done");
});`,
        options: [
          "\"A\", \"B\", \"Done\"",
          "\"A\", undefined, \"Done\"",
          "\"A\", \"B\", \"Error:\", \"Done\"",
          "\"A\", \"Done\""
        ],
        correct: 0,
        explanation: "resolve(\"A\") — პირველი .then იღებს \"A\"-ს და ბეჭდავს, შემდეგ აბრუნებს \"B\"-ს. მეორე .then იღებს \"B\"-ს. catch არ გაეშვება (შეცდომა არ იყო). finally ყოველთვის გაეშვება."
      },
      {
        topic: 'Promise',
        question: "რას აბრუნებს .then() მეთოდი?",
        code: `const result = fetch("https://api.example.com/data")
  .then(function (response) {
    return response.json();
  });

console.log(result instanceof Promise); // ?`,
        options: [
          "false — .then() მონაცემებს აბრუნებს",
          "true — .then() ყოველთვის ახალ Promise-ს აბრუნებს",
          "undefined",
          "Response ობიექტს"
        ],

    let currentIndex = 0;
    let answers = new Array(questions.length).fill(null);

    const progressBar = document.getElementById('progressBar');
    const questionCounter = document.getElementById('questionCounter');
    const questionCard = document.getElementById('questionCard');
    const sectionLabel = document.getElementById('sectionLabel');
    const questionText = document.getElementById('questionText');
    const codeBlock = document.getElementById('codeBlock');
    const optionsContainer = document.getElementById('optionsContainer');
    const feedback = document.getElementById('feedback');
    const explanationBox = document.getElementById('explanationBox');
    const explanationText = document.getElementById('explanationText');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const questionArea = document.getElementById('questionArea');
    const resultsScreen = document.getElementById('resultsScreen');

    function renderQuestion() {
      const q = questions[currentIndex];
      const total = questions.length;

      progressBar.style.width = ((currentIndex + 1) / total * 100) + '%';
      questionCounter.textContent = `შეკითხვა ${currentIndex + 1} / ${total}`;

      sectionLabel.textContent = q.topic;
      sectionLabel.className = 'section-label main';

      questionText.innerHTML = q.question;

      if (q.code) {
        codeBlock.textContent = q.code;
        codeBlock.classList.remove('hidden');
      } else {
        codeBlock.classList.add('hidden');
      }

      optionsContainer.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = opt;
        const answered = answers[currentIndex] !== null;

        if (answered) {
          btn.classList.add('disabled');
          if (i === q.correct) btn.classList.add('correct-answer');
          if (answers[currentIndex] === i && i !== q.correct) btn.classList.add('wrong-answer');
        } else {
          btn.addEventListener('click', () => selectAnswer(i));
        }
        optionsContainer.appendChild(btn);
      });

      if (answers[currentIndex] !== null) {
        feedback.classList.add('show');
        if (answers[currentIndex] === q.correct) {
          feedback.className = 'feedback show correct';
          feedback.textContent = 'სწორია! ';
          questionCard.classList.remove('incorrect');
          questionCard.classList.add('correct');
        } else {
          feedback.className = 'feedback show incorrect';
          feedback.textContent = 'არასწორია! სწორი პასუხი მონიშნულია მწვანედ.';
          questionCard.classList.remove('correct');
          questionCard.classList.add('incorrect');
        }
      } else {
        feedback.className = 'feedback';
        feedback.classList.remove('show');
        questionCard.classList.remove('correct', 'incorrect');
      }

      if (answers[currentIndex] !== null && q.explanation) {
        explanationText.textContent = q.explanation;
        explanationBox.classList.add('visible');
      } else {
        explanationBox.classList.remove('visible');
      }

      prevBtn.disabled = currentIndex === 0;
      nextBtn.textContent = currentIndex === total - 1 ? 'შედეგები →' : 'შემდეგი →';
    }

    function selectAnswer(index) {
      answers[currentIndex] = index;
      renderQuestion();
    }

    function navigate(dir) {
      if (dir === 1 && currentIndex === questions.length - 1) {
        showResults();
        return;
      }
      currentIndex += dir;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= questions.length) currentIndex = questions.length - 1;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showResults() {
      questionArea.classList.add('hidden');
      resultsScreen.classList.remove('hidden');

      let totalCorrect = 0;
      questions.forEach((q, i) => {
        if (answers[i] === q.correct) totalCorrect++;
      });

      const percent = Math.round(totalCorrect / questions.length * 100);
      const scoreCircle = document.getElementById('scoreCircle');
      const scorePercent = document.getElementById('scorePercent');
      const scoreLabel = document.getElementById('scoreLabel');
      const scoreBreakdown = document.getElementById('scoreBreakdown');

      scorePercent.textContent = percent + '%';

      if (percent >= 80) {
        scoreCircle.className = 'score-circle excellent';
        scoreLabel.textContent = 'შესანიშნავი!';
      } else if (percent >= 60) {
        scoreCircle.className = 'score-circle good';
        scoreLabel.textContent = 'კარგია!';
      } else {
        scoreCircle.className = 'score-circle needs-work';
        scoreLabel.textContent = 'გაიმეორე მასალა';
      }

      scoreBreakdown.innerHTML = `
        <strong>სულ:</strong> ${totalCorrect} / ${questions.length} სწორი პასუხი
      `;
    }

    function restartQuiz() {
      currentIndex = 0;
      answers = new Array(questions.length).fill(null);
      resultsScreen.classList.add('hidden');
      questionArea.classList.remove('hidden');
      renderQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    renderQuestion();
  </script>
